name: Pages

# Publishes the web editor to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site's address, for canonical links and the site map. Without the
      # repository variable ARATU_SITE_URL, scripts/site.mjs uses
      # https://aratu.live/; set the variable if the site moves.
      ARATU_SITE_URL: ${{ vars.ARATU_SITE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: node scripts/build.mjs
      - run: npm run smoke
      # The same files go to the VPS that serves aratu.live beside MusiMind's
      # API: rsync over SSH as aratu-deploy, whose key can only write
      # /srv/aratu/site (rrsync). Skipped while the secret is not set.
      - name: Send the site to the VPS
        env:
          DEPLOY_KEY: ${{ secrets.ARATU_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "No ARATU_DEPLOY_KEY: skipped."; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/aratu_deploy
          chmod 600 ~/.ssh/aratu_deploy
          echo "147.15.41.209 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIImWp/o6TeqgaFKq0K+lnoaHZfdX/D6A6S+ZTQvSIIVk" > ~/.ssh/known_hosts
          rsync -az --checksum --delete --stats -e "ssh -i $HOME/.ssh/aratu_deploy -o IdentitiesOnly=yes" dist/ aratu-deploy@147.15.41.209: | grep -E "Number of (regular )?files|Total transferred"
          rm -f ~/.ssh/aratu_deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
