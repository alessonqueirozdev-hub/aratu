<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aratu</title>
    <meta name="description" content="Aratu: a live-coding language that reads like music. Part of the Manguebyte ecosystem." />
    <link rel="icon" href="mascot.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="https://github.com/alessonqueirozdev-hub/aratu" target="_blank" rel="noopener">
        <img src="mascot.png" alt="" width="40" height="40" />
        <span class="name">Aratu</span>
        <span class="tagline" data-word="tagline"></span>
      </a>
      <div class="controls">
        <button id="play" class="play" data-word="play"></button>
        <button id="stop" class="stop" data-word="stop"></button>
        <label class="examples">
          <span data-word="examples"></span>
          <select id="examples"></select>
        </label>
        <div class="lang" role="group" aria-label="Idioma / Language">
          <button id="lang-pt">PT</button><button id="lang-en">EN</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite">
        <span><b data-word="bar"></b> <span id="bar">–</span></span>
        <span><b data-word="tempo"></b> <span id="bpm">–</span></span>
        <span><b data-word="meter"></b> <span id="meter">–</span></span>
        <span id="beat" class="beat"></span>
      </div>
    </header>
    <main class="work">
      <section class="editor" id="editor"></section>
      <aside class="side">
        <h2 data-word="messages"></h2>
        <ul id="messages" class="messages"></ul>
        <p class="note" id="note"></p>
      </aside>
    </main>
    <footer class="bottom">
      <span class="hint" data-word="hint"></span>
      <span class="links">
        <span data-word="ecosystem"></span>
        <a href="https://github.com/alessonqueirozdev-hub/manguebyte" target="_blank" rel="noopener">Manguebyte</a>
        ·
        <a href="https://github.com/alessonqueirozdev-hub/aratu" target="_blank" rel="noopener" data-word="source"></a>
      </span>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
</html>
